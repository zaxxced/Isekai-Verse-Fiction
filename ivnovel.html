<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isekai Verse - Full Image Scroll</title>
    <style>
        body {
            margin: 0; 
            padding: 40px 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white; 
            text-align: center;
            
            /* PENGATURAN BACKGROUND CUSTOM */
            background-image: url('placeholder/background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #0b1a13; 
            
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Overlay gelap agar fokus ke kartu */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); 
            z-index: -1;
        }

        .vertical-container {
            display: flex;
            flex-direction: column; 
            gap: 80px; 
            width: 100%;
            align-items: center;
        }

        .char-card {
            /* Dibuat relative agar teks bisa melayang di dalamnya */
            position: relative; 
            border: none; /* Menghilangkan border */
            border-radius: 16px; 
            text-decoration: none; 
            color: white;
            transition: 0.4s ease-out; 
            
            /* Menghilangkan padding agar gambar full menyentuh tepi */
            padding: 0; 
            
            height: 85vh; 
            max-height: 900px; 
            width: auto; 
            max-width: 90vw; 
            aspect-ratio: 4 / 5; 
            
            box-sizing: border-box;
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .char-card:hover {
            transform: translateY(-12px); 
            box-shadow: 0 15px 40px rgba(73, 206, 131, 0.5);
        }

        .char-card img { 
            width: 100%; 
            height: 100%;
            object-fit: cover; 
            display: block;
            filter: grayscale(40%);
            transition: 0.5s ease-out;
        }
        
        .char-card:hover img { 
            filter: grayscale(0%); 
            transform: scale(1.08); /* Efek zoom gambar sedikit diperbesar saat hover */
        }

        /* --- STYLING TEKS DI ATAS GAMBAR --- */
        .text-content {
            position: absolute;
            bottom: 0; /* Menempel di bagian bawah kartu */
            left: 0;
            width: 100%;
            box-sizing: border-box;
            padding: 30px 20px; /* Jarak teks ke tepi kotak background */
            
            /* Latar belakang hijau sangat gelap dan transparan di belakang teks */
            background: rgba(11, 26, 19, 0.85); 
            backdrop-filter: blur(8px); /* Efek kaca buram */
            
            text-align: center;
            z-index: 2; /* Memastikan teks selalu berada di atas gambar */
            transition: 0.3s;
        }
        
        .char-card h3 { 
            margin: 0 0 10px 0; 
            font-size: 32px; 
            color: #81E6AE; /* Aksen mint */
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        
        .char-card p { 
            margin: 0; 
            font-size: 18px; 
            color: #d5dbdb; 
        }

        @media (max-width: 600px) {
            .char-card {
                width: 90vw;
                height: auto;
            }
            .char-card h3 { font-size: 26px; }
            .char-card p { font-size: 16px; }
            .text-content { padding: 20px 15px; }
        }
    </style>
</head>
<body>

    <div class="vertical-container">
        
        <!-- KARTU 1 -->
        <a href="https://zaxxced.github.io/Rule-Breaker/" class="char-card">
            <img src="Image/rb.png" alt="Rule Breaker">
            <div class="text-content">
                <h3>RULE BREAKER</h3>
                <p>Wiki & Novel</p>
            </div>
        </a>

        <!-- KARTU 2 -->
        <a href="Zamy.html" class="char-card">
            <img src="Image/genom.png" alt="Zamy">
            <div class="text-content">
                <h3>GENOM</h3>
                <p>Wiki & Novel</p>
            </div>
        </a>

    </div>

</body>
</html>
