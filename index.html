<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isekai Verse Fiction - Beranda</title>
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white; text-align: center;
            /* PENGATURAN BACKGROUND CUSTOM */
            background-image: url('Image/background1.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            /* Latar belakang bernuansa hijau sangat gelap agar serasi dengan aksen mint */
            background-color: #0b1a13; 
            padding-bottom: 100px; 
        }

        /* Overlay gelap agar teks tetap mudah dibaca di atas gambar */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); 
            z-index: -1;
        }

        /* Navigasi transparan dengan hint hijau gelap */
        nav { background-color: rgba(14, 40, 28, 0.9); padding: 20px; font-size: 20px; font-weight: bold; letter-spacing: 2px;}
        
        .header-title { margin: 40px 0; position: relative; }
        /* Warna teks utama menggunakan #81E6AE */
        .header-title h1 { font-size: 42px; margin-bottom: 5px; color: #81E6AE; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .header-title p { color: #d5dbdb; font-size: 20px; }

        .character-grid {
            display: flex; flex-wrap: wrap; justify-content: center; 
            gap: 30px; 
            padding: 20px; max-width: 1200px; 
            margin: auto;
            position: relative;
        }

        .char-card {
            background-color: rgba(18, 50, 36, 0.85); 
            /* Warna border menggunakan versi sedikit lebih gelap dari #81E6AE */
            border: 2px solid #49CE83; 
            border-radius: 12px; 
            
            width: 250px; 
            padding: 20px; 
            
            text-decoration: none; 
            color: white;
            transition: 0.3s;
            backdrop-filter: blur(5px); 
            display: flex; 
            flex-direction: column;
            align-items: center;
        }

        .char-card:hover {
            background-color: #49CE83; /* Efek hover menggunakan warna yang sedikit lebih gelap */
            transform: translateY(-8px); 
        }

        .char-card img { 
            width: 100%; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            filter: grayscale(50%);
            transition: 0.3s;
            
            aspect-ratio: 4 / 5; 
            object-fit: cover; 
        }
        
        .char-card:hover img { filter: grayscale(0%); transform: scale(1.05); }
        
        .char-card h3 { margin: 0 0 8px 0; font-size: 20px; }
        .char-card p { margin: 0; font-size: 14px; color: #bdc3c7; }

        /* --- STYLING PENCARIAN MELAYANG --- */
        .search-container {
            position: fixed;
            bottom: 25px; 
            left: 50%;
            transform: translateX(-50%); 
            width: 90%;
            max-width: 450px; 
            z-index: 100;
        }

        .search-input {
            width: 100%;
            padding: 18px 25px; 
            border-radius: 35px;
            border: 2px solid #49CE83; 
            background-color: rgba(11, 26, 19, 0.85);
            color: white;
            font-size: 16px;
            text-align: center;
            outline: none;
            box-sizing: border-box;
            backdrop-filter: blur(10px); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transition: 0.3s;
        }

        .search-input:focus {
            /* Saat di-klik, border berubah ke warna mint terang yang diminta */
            border-color: #81E6AE;
            background-color: rgba(18, 50, 36, 0.95);
            box-shadow: 0 10px 40px rgba(129, 230, 174, 0.4);
        }

        .search-input::placeholder {
            color: #a2a9b1;
        }
    </style>
</head>
<body>

    <nav>SINCE 2023</nav>

    <div class="header-title">
        <h1>ISEKAI VERSE FICTION CENTER</h1>
        <p>Apa yang ingin anda ketahui?</p>
    </div>

    <div class="character-grid" id="charGrid">
        
        <a href="https://zaxxced.github.io/Rule-Breaker/" class="char-card">
            <img src="Image/rbwiki.png" alt="Rule Breaker">
            <h3>RULE BREAKER WIKI</h3>
            <p>NOVEL</p>
        </a>

        <a href="https://zaxxced.github.io/Genom/" class="char-card">
            <img src="Image/genomwiki.png" alt="Genom">
            <h3>GENOM WIKI</h3>
            <p>NOVEL</p>
        </a>

        <a href="ivnovel.html" class="char-card">
            <img src="Image/novel.png" alt="IV Novels">
            <h3>ISEKAI VERSE NOVEL'S</h3>
            <p>Read our novels!</p>
        </a>

    </div>

    <!-- KOLOM PENCARIAN MELAYANG -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Search...">
    </div>

    <!-- SCRIPT GABUNGAN: PENGURUTAN & PENCARIAN -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const grid = document.getElementById('charGrid');
            const cards = Array.from(grid.querySelectorAll('.char-card'));
            const searchInput = document.getElementById('searchInput');

            // 1. Proses mengurutkan kartu dari A - Z
            cards.sort((a, b) => {
                const nameA = a.querySelector('h3').innerText.toUpperCase();
                const nameB = b.querySelector('h3').innerText.toUpperCase();
                return nameA.localeCompare(nameB);
            });

            // Memasukkan kartu yang sudah berurutan kembali ke dalam grid
            grid.innerHTML = '';
            cards.forEach(card => grid.appendChild(card));

            // 2. Proses Pencarian (Real-time Filtering)
            searchInput.addEventListener('input', function() {
                const filterText = searchInput.value.toLowerCase();

                // Lakukan pengecekan pada setiap kartu
                cards.forEach(card => {
                    const charName = card.querySelector('h3').innerText.toLowerCase();
                    const charDesc = card.querySelector('p').innerText.toLowerCase();

                    // Jika nama atau deskripsi mengandung kata yang dicari, tampilkan kartu
                    if (charName.includes(filterText) || charDesc.includes(filterText)) {
                        card.style.display = ""; // Munculkan
                    } else {
                        card.style.display = "none"; // Sembunyikan
                    }
                });
            });
        });
    </script>

</body>
</html>
